name: pixora
description: "Pixora — a layered, cross-platform photo & graphic editor."
publish_to: 'none'
version: 0.16.1+21

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  share_plus: ^13.3.0
  image: ^4.10.1
  cupertino_icons: ^1.0.9
  archive: ^4.3.0
  xml: ^7.0.1
  gal: ^2.3.3
  characters: ^1.4.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar-Regular.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Noto Naskh Arabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf
    - family: Gulzar
      fonts:
        - asset: assets/fonts/Gulzar-Regular.ttf
    - family: Reem Kufi
      fonts:
        - asset: assets/fonts/ReemKufi.ttf
    - family: El Messiri
      fonts:
        - asset: assets/fonts/ElMessiri.ttf
    - family: Changa
      fonts:
        - asset: assets/fonts/Changa.ttf
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Markazi Text
      fonts:
        - asset: assets/fonts/MarkaziText.ttf
    - family: Lateef
      fonts:
        - asset: assets/fonts/Lateef-Regular.ttf
    - family: Scheherazade New
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
    - family: Aref Ruqaa
      fonts:
        - asset: assets/fonts/ArefRuqaa-Regular.ttf
    - family: Mirza
      fonts:
        - asset: assets/fonts/Mirza-Regular.ttf
    - family: Rakkas
      fonts:
        - asset: assets/fonts/Rakkas-Regular.ttf
    - family: Jomhuria
      fonts:
        - asset: assets/fonts/Jomhuria-Regular.ttf
    - family: Katibeh
      fonts:
        - asset: assets/fonts/Katibeh-Regular.ttf
    - family: Blaka
      fonts:
        - asset: assets/fonts/Blaka-Regular.ttf
    - family: Vibes
      fonts:
        - asset: assets/fonts/Vibes-Regular.ttf
    - family: Lemonada
      fonts:
        - asset: assets/fonts/Lemonada.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald.ttf
    - family: Bebas Neue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
    - family: Abril Fatface
      fonts:
        - asset: assets/fonts/AbrilFatface-Regular.ttf
    - family: Righteous
      fonts:
        - asset: assets/fonts/Righteous-Regular.ttf
    - family: Lobster
      fonts:
        - asset: assets/fonts/Lobster-Regular.ttf
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
    - family: Dancing Script
      fonts:
        - asset: assets/fonts/DancingScript.ttf
    - family: Permanent Marker
      fonts:
        - asset: assets/fonts/PermanentMarker-Regular.ttf

# App icons for every platform: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#1E8BFF"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
  web:
    generate: true
    background_color: "#1E8BFF"
    theme_color: "#3D7BFF"
